<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>CHARACTERS - Zombie Squad</title>
  <!-- Google Fonts: Fredoka & Outfit for AAA sci-fi game typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================================================
       RESET & ROOT VARIABLES
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --font-game: 'Fredoka', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-body: 'Outfit', sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: linear-gradient(180deg, #051c48 0%, #031336 40%, #010c24 70%, #1c120a 100%);
      font-family: var(--font-game);
      color: #ffffff;
      user-select: none;
      -webkit-user-select: none;
    }

    /* FULLSCREEN RESPONSIVE CONTAINER WITH SEAMLESS EXTENDED GAME ART BACKGROUND */
    .viewport-container {
      width: 100vw;
      height: 100%;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, #020d24 0%, #031336 40%, #010c24 70%, #170e06 100%);
    }

    /* Top Sky & Bottom Ground Gradient Overlays */
    .viewport-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 25vh;
      background: linear-gradient(180deg, #020d24 0%, #051d4b 50%, transparent 100%);
      pointer-events: none;
      z-index: 1;
    }

    .viewport-container::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 22vh;
      background: linear-gradient(0deg, #170e06 0%, #261608 45%, transparent 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* ==========================================================================
       MAIN CHARACTERS SCREEN FRAME
       - Edge-to-edge 100% viewport coverage on mobile (ZERO black bars!)
       - Centered on tablet & desktop with rich proportions
       ========================================================================== */
    .characters-frame {
      position: relative;
      width: 100vw;
      max-width: calc(100dvh * (1024 / 1536));
      height: calc(100vw * (1536 / 1024));
      max-height: 100dvh;
      aspect-ratio: 1024 / 1536;
      background: url('./assets/characters/characters_reference_master.png') no-repeat center center / contain;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      z-index: 10;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
    }

    @media (min-aspect-ratio: 750/1024) {
      .characters-frame {
        width: auto;
        height: 100dvh;
        aspect-ratio: 1024 / 1536;
        box-shadow: 0 0 60px rgba(0, 0, 0, 0.95), 0 0 40px rgba(0, 180, 255, 0.35);
        border-radius: 8px;
      }
    }

    /* ==========================================================================
       HEADER INTERACTIVE OVERLAYS
       ========================================================================== */
    .interactive-back-btn {
      position: absolute;
      left: 4.8%;
      top: 11.5%;
      width: 13.5%;
      height: 6.8%;
      background: transparent;
      border: none;
      cursor: pointer;
      border-radius: 12px;
      z-index: 50;
      transition: transform 0.1s ease, filter 0.15s ease;
    }
    .interactive-back-btn:active {
      transform: scale(0.92);
      filter: brightness(1.3);
    }

    /* Dynamic Coin Balance Display Overlay */
    .coin-live-badge {
      position: absolute;
      left: 53.5%;
      top: 12.6%;
      width: 12.0%;
      height: 4.5%;
      background: #031336;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 25;
      pointer-events: none;
    }
    .coin-live-text {
      font-family: var(--font-game);
      font-size: clamp(12px, 2.2cqi, 17px);
      font-weight: 800;
      color: #fff9c4;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .interactive-coin-plus {
      position: absolute;
      left: 66.8%;
      top: 12.2%;
      width: 6.4%;
      height: 5.2%;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 30;
      border-radius: 6px;
      transition: transform 0.1s ease;
    }
    .interactive-coin-plus:active { transform: scale(0.85); }

    /* Dynamic Diamond Balance Display Overlay */
    .diamond-live-badge {
      position: absolute;
      left: 76.5%;
      top: 12.6%;
      width: 12.0%;
      height: 4.5%;
      background: #031336;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 25;
      pointer-events: none;
    }
    .diamond-live-text {
      font-family: var(--font-game);
      font-size: clamp(12px, 2.2cqi, 17px);
      font-weight: 800;
      color: #bae6fd;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .interactive-diamond-plus {
      position: absolute;
      left: 89.8%;
      top: 12.2%;
      width: 6.4%;
      height: 5.2%;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 30;
      border-radius: 6px;
      transition: transform 0.1s ease;
    }
    .interactive-diamond-plus:active { transform: scale(0.85); }

    /* ==========================================================================
       CAROUSEL ARROWS (< and >)
       ========================================================================== */
    .interactive-arrow-btn {
      position: absolute;
      width: 9.5%;
      height: 8.5%;
      background: transparent;
      border: none;
      cursor: pointer;
      border-radius: 12px;
      z-index: 40;
      transition: transform 0.12s ease;
    }
    .interactive-arrow-btn:active {
      transform: scale(0.88);
    }
    .arrow-left {
      left: 4.5%;
      top: 31.8%;
    }
    .arrow-right {
      right: 4.5%;
      top: 31.8%;
    }

    /* ==========================================================================
       MAIN SHOWCASE HERO CONTAINER (Hologram Avatar Overlay)
       ========================================================================== */
    .hero-showcase-avatar {
      position: absolute;
      left: 31.0%;
      top: 20.5%;
      width: 38.0%;
      height: 23.5%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      pointer-events: none;
    }
    .hero-showcase-avatar img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 16px rgba(0, 0, 0, 0.8)) drop-shadow(0 0 12px rgba(0, 210, 255, 0.45));
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .hero-showcase-avatar.punch img {
      transform: scale(1.12);
    }

    /* Main Showcase Action Button (EQUIPPED / EQUIP HERO / UNLOCK) */
    .hero-main-action-btn {
      position: absolute;
      left: 32.0%;
      top: 44.2%;
      width: 36.0%;
      height: 5.6%;
      border-radius: 24px;
      font-family: var(--font-game);
      font-size: clamp(14px, 2.6cqi, 19px);
      font-weight: 900;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      z-index: 45;
      border: none;
      outline: none;
      transition: transform 0.12s ease, filter 0.15s ease, box-shadow 0.15s ease;
    }
    .hero-main-action-btn:active {
      transform: scale(0.94);
    }

    .btn-state-equipped {
      background: linear-gradient(180deg, #5df389 0%, #22c55e 50%, #15803d 100%);
      box-shadow: 0 4px 0 #0d5326, 0 6px 14px rgba(0, 0, 0, 0.6);
      color: #ffffff;
      -webkit-text-stroke: 1px #052e16;
      text-shadow: 0 2px 0 #052e16;
    }

    .btn-state-ready {
      background: linear-gradient(180deg, #60a5fa 0%, #3b82f6 50%, #1d4ed8 100%);
      box-shadow: 0 4px 0 #1e3a8a, 0 6px 14px rgba(0, 0, 0, 0.6);
      color: #ffffff;
      -webkit-text-stroke: 1px #0f172a;
      text-shadow: 0 2px 0 #0f172a;
    }

    .btn-state-unlock-coins {
      background: linear-gradient(180deg, #ffea38 0%, #f59e0b 50%, #b45309 100%);
      box-shadow: 0 4px 0 #78350f, 0 6px 14px rgba(0, 0, 0, 0.6);
      color: #ffffff;
      -webkit-text-stroke: 1px #451a03;
      text-shadow: 0 2px 0 #451a03;
    }

    .btn-state-unlock-gems {
      background: linear-gradient(180deg, #38bdf8 0%, #0ea5e9 50%, #0369a1 100%);
      box-shadow: 0 4px 0 #0c4a6e, 0 6px 14px rgba(0, 0, 0, 0.6);
      color: #ffffff;
      -webkit-text-stroke: 1px #082f49;
      text-shadow: 0 2px 0 #082f49;
    }

    /* ==========================================================================
       5 BOTTOM CHARACTER SELECTION CARDS
       ========================================================================== */
    .char-card-touch-zone {
      position: absolute;
      cursor: pointer;
      z-index: 35;
      border-radius: 18px;
      transition: transform 0.12s ease;
    }
    .char-card-touch-zone:hover {
      transform: translateY(-2px);
    }
    .char-card-touch-zone:active {
      transform: scale(0.97);
    }

    /* Row 1 Card Positions */
    .card-touch-soldier {
      left: 4.0%;
      top: 50.8%;
      width: 29.8%;
      height: 19.8%;
    }
    .card-touch-ranger {
      left: 35.0%;
      top: 50.8%;
      width: 29.8%;
      height: 19.8%;
    }
    .card-touch-heavy {
      left: 66.0%;
      top: 50.8%;
      width: 29.8%;
      height: 19.8%;
    }

    /* Row 2 Card Positions */
    .card-touch-sniper {
      left: 19.5%;
      top: 71.8%;
      width: 29.8%;
      height: 19.8%;
    }
    .card-touch-medic {
      left: 51.0%;
      top: 71.8%;
      width: 29.8%;
      height: 19.8%;
    }

    /* Selected Green Ring Indicator */
    .selection-ring {
      position: absolute;
      inset: -3px;
      border: 3px solid #00ff66;
      border-radius: 20px;
      box-shadow: 0 0 16px rgba(0, 255, 102, 0.8), inset 0 0 10px rgba(0, 255, 102, 0.4);
      pointer-events: none;
      display: none;
      animation: pulseGlow 1.8s infinite alternate;
    }
    @keyframes pulseGlow {
      from { opacity: 0.75; transform: scale(0.99); }
      to { opacity: 1; transform: scale(1.01); }
    }
    .char-card-touch-zone.active .selection-ring {
      display: block;
    }

    /* Card Pill Price Text Overlays (Aligned directly inside the 3D button bases!) */
    .card-pill-label {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-game);
      font-size: clamp(11px, 2.0cqi, 15px);
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      letter-spacing: 0.4px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 38;
    }

    .pill-label-soldier {
      left: 13.5%;
      top: 65.2%;
      width: 17.0%;
      height: 4.2%;
    }
    .pill-label-ranger {
      left: 45.5%;
      top: 65.2%;
      width: 17.0%;
      height: 4.2%;
    }
    .pill-label-heavy {
      left: 76.5%;
      top: 65.2%;
      width: 17.0%;
      height: 4.2%;
    }
    .pill-label-sniper {
      left: 30.5%;
      top: 86.2%;
      width: 17.0%;
      height: 4.2%;
    }
    .pill-label-medic {
      left: 62.0%;
      top: 86.2%;
      width: 17.0%;
      height: 4.2%;
    }

    /* Notification Multiplier Pop */
    .toast-pop {
      position: fixed;
      top: 25%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.7);
      background: linear-gradient(180deg, #104ba3 0%, #062359 100%);
      border: 2px solid #00f0ff;
      border-radius: 16px;
      padding: 12px 24px;
      color: #ffffff;
      font-size: 1.25rem;
      font-weight: 900;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9), 0 0 25px rgba(0, 240, 255, 0.6);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .toast-pop.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
  </style>
</head>
<body>

  <div class="viewport-container">

    <!-- MAIN CHARACTERS SCREEN FRAME (Matches Reference Art & Shop Screen) -->
    <main class="characters-frame" id="charactersFrame">

      <!-- 1. BACK BUTTON -->
      <button class="interactive-back-btn" id="btnBack" title="Back to Game" onclick="handleBackAction()"></button>

      <!-- 2. DYNAMIC CURRENCY HUD (Live badges synced with localStorage) -->
      <div class="coin-live-badge">
        <span class="coin-live-text" id="hudCoinsText">5,980</span>
      </div>
      <button class="interactive-coin-plus" title="Add Coins" onclick="goToShop('Coins')"></button>

      <div class="diamond-live-badge">
        <span class="diamond-live-text" id="hudGemsText">50</span>
      </div>
      <button class="interactive-diamond-plus" title="Add Gems" onclick="goToShop('Diamonds')"></button>

      <!-- 3. CAROUSEL NAVIGATION ARROWS -->
      <button class="interactive-arrow-btn arrow-left" id="btnArrowLeft" title="Previous Character" onclick="cycleHero(-1)"></button>
      <button class="interactive-arrow-btn arrow-right" id="btnArrowRight" title="Next Character" onclick="cycleHero(1)"></button>

      <!-- 4. HERO SHOWCASE CHAMBER AVATAR -->
      <div class="hero-showcase-avatar" id="showcaseAvatarWrap">
        <img id="showcaseAvatarImg" src="./assets/characters/dynamic/Zombie_Squad_Characters_Assets/13_centered_main_soldier.png" alt="Showcase Hero" />
      </div>

      <!-- 5. MAIN HERO ACTION BUTTON (Equipped / Equip / Unlock) -->
      <button class="hero-main-action-btn btn-state-equipped" id="btnMainHeroAction" onclick="handleMainHeroAction()">
        <span id="mainActionLabel">✓ EQUIPPED</span>
      </button>

      <!-- 6. FIVE BOTTOM CHARACTER SELECTION CARDS -->
      <!-- Card 1: Soldier -->
      <div class="char-card-touch-zone card-touch-soldier active" id="card_soldier" onclick="selectHero('soldier')">
        <div class="selection-ring"></div>
      </div>
      <div class="card-pill-label pill-label-soldier" id="pill_soldier">EQUIPPED</div>

      <!-- Card 2: Ranger -->
      <div class="char-card-touch-zone card-touch-ranger" id="card_ranger" onclick="selectHero('ranger')">
        <div class="selection-ring"></div>
      </div>
      <div class="card-pill-label pill-label-ranger" id="pill_ranger">2,500 COINS</div>

      <!-- Card 3: Heavy -->
      <div class="char-card-touch-zone card-touch-heavy" id="card_heavy" onclick="selectHero('heavy')">
        <div class="selection-ring"></div>
      </div>
      <div class="card-pill-label pill-label-heavy" id="pill_heavy">5,000 COINS</div>

      <!-- Card 4: Sniper -->
      <div class="char-card-touch-zone card-touch-sniper" id="card_sniper" onclick="selectHero('sniper')">
        <div class="selection-ring"></div>
      </div>
      <div class="card-pill-label pill-label-sniper" id="pill_sniper">50 GEMS</div>

      <!-- Card 5: Medic -->
      <div class="char-card-touch-zone card-touch-medic" id="card_medic" onclick="selectHero('medic')">
        <div class="selection-ring"></div>
      </div>
      <div class="card-pill-label pill-label-medic" id="pill_medic">100 GEMS</div>

    </main>
  </div>

  <!-- Multiplier Notification Pop -->
  <div class="toast-pop" id="toastPop">🎉 HERO EQUIPPED!</div>

  <script>
    /* ==========================================================================
       HEROES DATABASE & STATE
       ========================================================================== */
    const HERO_KEYS = ['soldier', 'ranger', 'heavy', 'sniper', 'medic'];

    const HEROES = {
      soldier: {
        name: 'SOLDIER',
        role: 'Assault Specialist',
        costType: 'free',
        cost: 0,
        avatarImg: './assets/characters/dynamic/Zombie_Squad_Characters_Assets/13_centered_main_soldier.png'
      },
      ranger: {
        name: 'RANGER',
        role: 'Rapid Scout',
        costType: 'coins',
        cost: 2500,
        avatarImg: './assets/characters/dynamic/Zombie_Squad_Characters_Assets/23_red_soldier_portrait.png'
      },
      heavy: {
        name: 'HEAVY',
        role: 'Demolition Tank',
        costType: 'coins',
        cost: 5000,
        avatarImg: './assets/characters/dynamic/Zombie_Squad_Characters_Assets/24_yellow_soldier_portrait.png'
      },
      sniper: {
        name: 'SNIPER',
        role: 'Long-Range Marksman',
        costType: 'gems',
        cost: 50,
        avatarImg: './assets/characters/dynamic/Zombie_Squad_Characters_Assets/25_purple_soldier_portrait.png'
      },
      medic: {
        name: 'MEDIC',
        role: 'Combat Support',
        costType: 'gems',
        cost: 100,
        avatarImg: './assets/characters/dynamic/Zombie_Squad_Characters_Assets/26_pink_medic_portrait.png'
      }
    };

    // Currencies
    let userCoins = parseInt(localStorage.getItem('ZombieSquad_Coins') || '5980', 10);
    let userGems = parseInt(localStorage.getItem('ZombieSquad_Gems') || '50', 10);

    // Selected & Equipped Heroes
    let equippedHero = localStorage.getItem('ZombieSquad_SelectedHero') || 'soldier';
    let selectedHero = equippedHero;

    // Unlocked status
    function isHeroUnlocked(key) {
      if (key === 'soldier') return true;
      return localStorage.getItem('HeroUnlocked_' + key) === 'true';
    }

    function setHeroUnlocked(key) {
      localStorage.setItem('HeroUnlocked_' + key, 'true');
    }

    /* ==========================================================================
       AUDIO SYNTHESIZER FALLBACK
       ========================================================================== */
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playSound(type) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        if (type === 'tap') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(450, now);
          osc.frequency.exponentialRampToValueAtTime(750, now + 0.08);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'equip') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.18);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.22);
        } else if (type === 'unlock') {
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const chime = audioCtx.createOscillator();
            const chimeGain = audioCtx.createGain();
            chime.connect(chimeGain);
            chimeGain.connect(audioCtx.destination);
            chime.type = 'sine';
            chime.frequency.setValueAtTime(freq, now + i * 0.06);
            chimeGain.gain.setValueAtTime(0.25, now + i * 0.06);
            chimeGain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.25);
            chime.start(now + i * 0.06);
            chime.stop(now + i * 0.06 + 0.25);
          });
        }
      } catch (e) {}
    }

    /* ==========================================================================
       UI UPDATES & RENDERING
       ========================================================================== */
    function updateCurrencyHud() {
      document.getElementById('hudCoinsText').textContent = userCoins.toLocaleString();
      document.getElementById('hudGemsText').textContent = userGems.toLocaleString();
    }

    function updateHeroView() {
      const hero = HEROES[selectedHero];
      if (!hero) return;

      // 1. Update Showcase Avatar with punch scale (Soldier is already illustrated in the background)
      const avatarWrap = document.getElementById('showcaseAvatarWrap');
      const avatarImg = document.getElementById('showcaseAvatarImg');
      if (selectedHero === 'soldier') {
        avatarWrap.style.display = 'none';
      } else {
        avatarWrap.style.display = 'flex';
        avatarImg.src = hero.avatarImg;
        avatarWrap.classList.add('punch');
        setTimeout(() => avatarWrap.classList.remove('punch'), 200);
      }

      // 2. Update Active Card Ring
      HERO_KEYS.forEach(k => {
        const cardEl = document.getElementById('card_' + k);
        if (cardEl) {
          if (k === selectedHero) cardEl.classList.add('active');
          else cardEl.classList.remove('active');
        }
      });

      // 3. Update Action Button (Hidden when default Soldier is equipped so artwork button shows cleanly)
      const actionBtn = document.getElementById('btnMainHeroAction');
      const actionLabel = document.getElementById('mainActionLabel');

      actionBtn.className = 'hero-main-action-btn';

      const unlocked = isHeroUnlocked(selectedHero);
      const isEquipped = (selectedHero === equippedHero);

      if (isEquipped && selectedHero === 'soldier') {
        actionBtn.style.opacity = '0';
        actionBtn.style.pointerEvents = 'none';
      } else if (isEquipped) {
        actionBtn.style.opacity = '1';
        actionBtn.style.pointerEvents = 'auto';
        actionBtn.classList.add('btn-state-equipped');
        actionLabel.textContent = '✓ EQUIPPED';
      } else if (unlocked) {
        actionBtn.style.opacity = '1';
        actionBtn.style.pointerEvents = 'auto';
        actionBtn.classList.add('btn-state-ready');
        actionLabel.textContent = 'EQUIP HERO';
      } else {
        actionBtn.style.opacity = '1';
        actionBtn.style.pointerEvents = 'auto';
        if (hero.costType === 'coins') {
          actionBtn.classList.add('btn-state-unlock-coins');
          actionLabel.textContent = `UNLOCK (${hero.cost.toLocaleString()})`;
        } else {
          actionBtn.classList.add('btn-state-unlock-gems');
          actionLabel.textContent = `UNLOCK (${hero.cost} GEMS)`;
        }
      }

      // 4. Update Card Pill Badges
      HERO_KEYS.forEach(k => {
        const pill = document.getElementById('pill_' + k);
        if (!pill) return;
        const h = HEROES[k];
        if (k === equippedHero) {
          pill.textContent = 'EQUIPPED';
          pill.style.color = '#7eff9f';
        } else if (isHeroUnlocked(k)) {
          pill.textContent = 'READY';
          pill.style.color = '#7ad3ff';
        } else {
          if (h.costType === 'coins') {
            pill.textContent = `${h.cost.toLocaleString()} COINS`;
            pill.style.color = '#fff69b';
          } else {
            pill.textContent = `${h.cost} GEMS`;
            pill.style.color = '#7fe5ff';
          }
        }
      });
    }

    function selectHero(heroKey) {
      playSound('tap');
      selectedHero = heroKey;
      updateHeroView();
    }

    function cycleHero(dir) {
      playSound('tap');
      let idx = HERO_KEYS.indexOf(selectedHero);
      idx = (idx + dir + HERO_KEYS.length) % HERO_KEYS.length;
      selectedHero = HERO_KEYS[idx];
      updateHeroView();
    }

    function handleMainHeroAction() {
      const hero = HEROES[selectedHero];
      if (!hero) return;

      const unlocked = isHeroUnlocked(selectedHero);

      if (unlocked) {
        // Equip
        equippedHero = selectedHero;
        localStorage.setItem('ZombieSquad_SelectedHero', equippedHero);
        playSound('equip');
        showToast(`🎉 ${hero.name} EQUIPPED!`);
        updateHeroView();
      } else {
        // Unlock attempt
        if (hero.costType === 'coins') {
          if (userCoins >= hero.cost) {
            userCoins -= hero.cost;
            localStorage.setItem('ZombieSquad_Coins', userCoins);
            setHeroUnlocked(selectedHero);
            equippedHero = selectedHero;
            localStorage.setItem('ZombieSquad_SelectedHero', equippedHero);
            playSound('unlock');
            showToast(`🔥 ${hero.name} UNLOCKED & EQUIPPED!`);
            updateCurrencyHud();
            updateHeroView();
          } else {
            showToast(`❌ Need ${(hero.cost - userCoins).toLocaleString()} More Coins!`);
          }
        } else if (hero.costType === 'gems') {
          if (userGems >= hero.cost) {
            userGems -= hero.cost;
            localStorage.setItem('ZombieSquad_Gems', userGems);
            setHeroUnlocked(selectedHero);
            equippedHero = selectedHero;
            localStorage.setItem('ZombieSquad_SelectedHero', equippedHero);
            playSound('unlock');
            showToast(`💎 ${hero.name} UNLOCKED & EQUIPPED!`);
            updateCurrencyHud();
            updateHeroView();
          } else {
            showToast(`❌ Need ${hero.cost - userGems} More Gems!`);
          }
        }
      }
    }

    function showToast(msg) {
      const pop = document.getElementById('toastPop');
      pop.textContent = msg;
      pop.classList.add('show');
      setTimeout(() => pop.classList.remove('show'), 1600);
    }

    function handleBackAction() {
      playSound('tap');
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ action: 'closeCharacters', type: 'BACK' }, '*');
      }
      setTimeout(() => {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = 'index.html';
        }
      }, 80);
    }

    function goToShop(tab) {
      playSound('tap');
      window.location.href = 'shop.html';
    }

    // Init on DOM ready
    window.addEventListener('DOMContentLoaded', () => {
      updateCurrencyHud();
      updateHeroView();
    });
  </script>
</body>
</html>
